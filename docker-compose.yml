services:
  postgres:
    image: postgres:16-alpine
    container_name: tasko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasko
      POSTGRES_PASSWORD: tasko
      POSTGRES_DB: tasko
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasko -d tasko"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Необязательно: локальный SMTP для разработки (письма видны на http://localhost:8025).
  # В .env бэкенда: SMTP_HOST=localhost, SMTP_PORT=1025
  mailpit:
    image: axllent/mailpit:latest
    container_name: tasko-mailpit
    restart: unless-stopped
    profiles: ["dev-mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
